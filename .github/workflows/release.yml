name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for git shortlog to compute contributors

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-Compile Binaries
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p dist/staging

          targets=(
            "linux/amd64/linux-amd64"
            "linux/arm64/linux-arm64"
            "darwin/amd64/darwin-amd64"
            "darwin/arm64/darwin-arm64"
            "windows/amd64/windows-amd64"
          )

          for entry in "${targets[@]}"; do
            IFS="/" read -r goos goarch suffix <<< "$entry"
            echo "→ Building ${goos}/${goarch}..."
            bin_name="horreum"
            if [ "$goos" = "windows" ]; then
              bin_name="horreum.exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -ldflags="-s -w" \
              -o "dist/staging/${bin_name}" ./cmd/horreum
            tar -czf "dist/horreum-${VERSION}-${suffix}.tar.gz" \
              -C dist "staging/${bin_name}"
            rm "dist/staging/${bin_name}"
          done

          rmdir dist/staging

      - name: Previous Tag
        id: prevtag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || echo "")
          if [ -z "$PREV" ]; then
            # fallback: first commit
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV"

      - name: Generate Release Body
        run: |
          chmod +x .github/scripts/release-body.sh
          .github/scripts/release-body.sh \
            "${GITHUB_REF#refs/tags/}" \
            "${{ steps.prevtag.outputs.tag }}" \
            dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Horreum ${{ github.ref_name }}
          body_path: release-body.md
          files: dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
