name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run golangci-lint
        run: |
          # Pin golangci-lint to a specific commit SHA for reproducible lint runs.
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@8c13211dd7a0f9e9c1688c93a4a4e4fbc690537b5 \
            run --out-format checkstyle > golangci-lint-report.out 2>&1 || true

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: golangci-lint-report.out

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run Tests with Race Detector and Coverage
        run: |
          go test -v -race -coverprofile=coverage.out ./internal/...

      - name: Verify Coverage Threshold (>= 75%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          echo "Total Statement Coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 75.0) { print "Coverage below 75%"; exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run Benchmarks
        run: |
          # benchtime=10x caps each benchmark at 10 iterations so the
          # job finishes quickly on PR runners and is no longer
          # killed by the 20m timeout.  Release builds use the full
          # benchmarks via Makefile bench target.
          go test -bench=. -benchmem -benchtime=10x -count=1 -timeout=20m ./internal/arena/... ./internal/index/... | tee bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench.txt
